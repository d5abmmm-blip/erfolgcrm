# nginx внутри web-контейнера: SPA-раздача + защитные заголовки.
# TLS терминируется на хосте, в Caddy; заголовки здесь — вторая линия
# на случай, если внешний прокси их не ставит.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # «Ремни безопасности» браузера
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Камера нужна PWA инженеров (фото актов и сканер штрихкодов)
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # Хэшированные ассеты Vite — кэшировать навсегда
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback; index.html не кэшируем, чтобы деплой подхватывался сразу
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  }
}
