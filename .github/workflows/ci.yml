name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erfolg
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: erfolg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      # Версию pnpm НЕ задаём здесь: она уже объявлена в package.json
      # ("packageManager": "pnpm@10.30.0"), и action-setup читает её оттуда.
      # Если указать оба места, свежие версии плагина обрывают прогон с
      # «Multiple versions of pnpm specified» ещё до установки зависимостей —
      # именно из-за этого CI был красным на всех прогонах с 20.06.2026.
      # Одно место правды: package.json, там же его видит corepack локально.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24, а не 22: боевые образы api и web собираются на node:24-alpine
          # (apps/*/Dockerfile), и сканер штрих-кодов @zxing/library требует
          # Node >= 24. На 22 установка обрывается ERR_PNPM_UNSUPPORTED_ENGINE.
          # CI должен проверять тот же Node, на котором код работает на бою.
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Тесты ходят в erfolg_test под ролью app_runtime и ждут применённых
      # миграций, RLS и seed-тенантов (apps/api/src/__tests__/setup.ts падает
      # с «Seed data missing», если их нет). Сервис postgres поднимает пустую
      # базу, поэтому её нужно подготовить — рецепт из docs/dev-test-db.md.
      # Раньше этого шага не было вовсе, и шаг Test свалился бы целиком; никто
      # этого не видел, потому что прогон обрывался ещё на установке pnpm.
      - name: Конфигурация из примера (ключи и адреса баз для разработки)
        run: cp .env.example .env

      - name: Подготовка тестовой базы
        run: |
          # Функция нужна ДО миграций: журнальная 0027 создаёт RLS-политики,
          # которые на неё ссылаются, а создаёт её обычно setup-rls — позже.
          PGPASSWORD=dev_only_password psql -h localhost -U erfolg -d erfolg_test -c \
            "CREATE OR REPLACE FUNCTION current_tenant_id() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULLIF(current_setting(''app.current_tenant_id'', true), '''')::uuid';"
          pnpm --filter @erfolg/db migrate
          pnpm --filter @erfolg/db setup-rls
          pnpm --filter @erfolg/db seed
        env:
          # Миграции, RLS и seed идут под владельцем (erfolg) и ОБЯЗАТЕЛЬНО
          # против erfolg_test: без этого drizzle возьмёт дефолт с erfolg_dev.
          # Переменные шага важнее .env — dotenv не перетирает заданное.
          DATABASE_OWNER_URL: postgresql://erfolg:dev_only_password@localhost:5432/erfolg_test

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://app_runtime:app_runtime_dev_only@localhost:5432/erfolg_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Build
        run: pnpm build
